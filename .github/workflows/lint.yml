name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Keep in step with GOLANGCI_LINT_VERSION in the Makefile.
          version: v2.15.0
