version: 2
# One grouped pull request a month for each ecosystem, into develop.
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
