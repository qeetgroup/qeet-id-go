name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go.sum

      # A Go module has nothing to "build" for release — go.sum/go.mod plus
      # the tag are the published artifact (go get resolves it directly from
      # the tag). The only gate here is that the tagged commit is green.
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -count=1 ./...

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Pull this tag's section out of CHANGELOG.md as the release body.
          generate_release_notes: true
