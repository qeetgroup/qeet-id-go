# qeet-id-go — repository context metadata (Level 2).
# Inherits qeetgroup/qeet-context (L0) and qeetgroup/qeet-id-context (L1).

schema_version: 1

context:
  type: repository
  level: L2
  canonical: true
  last_verified: "2026-11-05"

inheritance:
  organization: {repository: qeetgroup/qeet-context, level: L0}
  product:      {repository: qeetgroup/qeet-id-context, level: L1}

repository:
  name: qeet-id-go
  product: qeet-id
  type: sdk
  role: sdk
  status: development        # version string 0.1.0; no tag pushed, never fetched by the module proxy
  visibility: public
  default_branch: main

runtime:
  language: Go
  version: "1.26"            # go directive 1.26.0; CI tests 1.26.x and 1.27.x
  support_policy: the two most recent Go releases
  third_party_deps: none     # standard library only; no go.sum

module:
  name: github.com/qeetgroup/qeet-id-go
  package: qeetid            # imported as: qeetid "github.com/qeetgroup/qeet-id-go"
  subpackages:
    webhook: verify and parse webhook deliveries
    jwt: verify access tokens against the JWKS, net/http middleware

architecture:
  style: root-package-file-per-service        # ADR-0004
  client_shape: flat-service-fields           # client.Users, client.Webhooks, ...
  services: 48
  machinery: unexported in the root package   # transport.go, errors.go, pagination.go, auth.go, options.go
  internal:
    version: internal/version                 # version string and User-Agent

contracts:
  consumes:
    api: qeet-id-server        # api/openapi/{auth,management,federation,developer,operations}.yaml
    base_url: https://api.id.qeet.in
    jwks_url: https://api.id.qeet.in/.well-known/jwks.json
  auth_schemes:
    - "Authorization: ApiKey <key>"
    - "Authorization: Bearer <token>   # service principal (client credentials) or token source"
    - "Basic <client_id:client_secret>  # OAuth endpoints only"
  webhook_signature: "X-Qeet-Signature: sha256=hex(HMAC-SHA256(secret, X-Qeet-Timestamp + '.' + body)); two values during rotation"

defaults:
  timeout_per_attempt: 30s
  max_retries: 2
  retry_backoff: 500ms..8s, exponential, jitter
  max_retry_after: 60s
  max_response_bytes: 32MiB
  webhook_tolerance: 5m
  jwt_leeway: 30s
  jwks_cache_ttl: 10m
  jwks_min_refresh_interval: 1m
  retry_policy: >-
    network/408/500/502/503/504 only for GET, HEAD, DELETE or a request with an Idempotency-Key;
    429 or 503 with Retry-After for any request; never 401 or auth.session_revoked

commands:
  build: make build
  test:  make test        # go test -race -count=1 ./...
  vet:   make vet
  fmt:   make fmt         # fails if gofmt -l is non-empty
  lint:  make lint        # golangci-lint v2.15.0
  vuln:  make vuln        # govulncheck v1.9.0
  tidy:  make tidy
  ci:    make ci

ci:
  workflows: [ci.yml, release.yml]
  verify: [go build, go vet, golangci-lint, govulncheck, gitleaks]   # PRs into develop and main; go test -race on both Go releases runs locally (make ci)
  release: PR develop -> main raises SDK in internal/version by hand; push main -> no tag yet -> tag vX.Y.Z + GitHub release (the tag IS the artifact)

security:
  sensitive_paths:
    - webhook/webhook.go     # HMAC verification, tolerance
    - jwt/                   # ES256 verification, JWKS cache
    - auth.go                # credentials and token caching
    - transport.go           # auth headers, retry rules
  never: [log a credential, skip signature or kid verification, retry a 401, widen retry rules]

llm_context:
  primary_instructions: AGENTS.md
  canonical: docs/llm/context.md
  boundaries: docs/llm/boundaries.md
  workflows: docs/llm/workflows.md
  architecture_map: docs/llm/architecture-map.md
  adapters: [CLAUDE.md, GEMINI.md, .github/copilot-instructions.md]
